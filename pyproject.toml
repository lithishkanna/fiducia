[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-trust"
version = "0.1.0"
description = "Binance BTC/USDT perpetual order-book heatmap & order-flow research system with wall trust scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "numba>=0.59.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "torch>=2.2.0",
    "pytorch-lightning>=2.2.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "shap>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
